<svg xmlns="http://www.w3.org/2000/svg" class="pbx" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="pbx-hw-title pbx-hw-desc">
<title id="pbx-hw-title">How podbox works</title>
<desc id="pbx-hw-desc">Write a TOML file, optionally extending a profile. podbox build generates an OCI image and Quadlet units. systemd --user then runs the container and its host-side services.</desc>
<style>
.pbx{--k-surface:#e6e9ef;--k-base:#eff1f5;--k-border:#acb0be;--k-faint:#ccd0da;--k-text:#4c4f69;--k-sub:#5c5f77;--k-muted:#8c8fa1;--k-mauve:#8839ef;--k-blue:#1e66f5;--k-green:#40a02b;--k-peach:#fe640b}
@media (prefers-color-scheme:dark){.pbx{--k-surface:#181825;--k-base:#1e1e2e;--k-border:#585b70;--k-faint:#313244;--k-text:#cdd6f4;--k-sub:#a6adc8;--k-muted:#7f849c;--k-mauve:#cba6f7;--k-blue:#89b4fa;--k-green:#a6e3a1;--k-peach:#fab387}}
.pbx{--c-surface:var(--bg-mantle,var(--k-surface));--c-base:var(--bg-base,var(--k-base));--c-border:var(--border-focus,var(--k-border));--c-faint:var(--border,var(--k-faint));--c-text:var(--text-primary,var(--k-text));--c-sub:var(--text-subtext,var(--k-sub));--c-muted:var(--text-muted,var(--k-muted));--c-mauve:var(--accent-mauve,var(--k-mauve));--c-blue:var(--accent-blue,var(--k-blue));--c-green:var(--accent-green,var(--k-green));--c-peach:var(--accent-peach,var(--k-peach))}
.pbx text{font-family:Geist,Inter,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;fill:var(--c-text)}
.pbx .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
.pbx .t{font-size:13px;font-weight:600}
.pbx .s{font-size:10.5px;fill:var(--c-sub)}
.pbx .m{font-size:10.5px;fill:var(--c-muted)}
.pbx .lbl{font-size:11px;fill:var(--c-muted);letter-spacing:.02em}
.pbx .num{font-size:11px;font-weight:600;fill:var(--c-base)}
.pbx .box{fill:var(--c-surface);stroke:var(--c-border);stroke-width:1}
.pbx .opt{stroke-dasharray:4 3}
.pbx .acc-mauve{fill:color-mix(in srgb,var(--c-mauve) 13%,var(--c-surface));stroke:var(--c-mauve)}
.pbx .acc-blue{fill:color-mix(in srgb,var(--c-blue) 13%,var(--c-surface));stroke:var(--c-blue)}
.pbx .acc-peach{fill:color-mix(in srgb,var(--c-peach) 13%,var(--c-surface));stroke:var(--c-peach)}
.pbx .acc-green{fill:color-mix(in srgb,var(--c-green) 13%,var(--c-surface));stroke:var(--c-green)}
.pbx .region{fill:color-mix(in srgb,var(--c-faint) 22%,transparent);stroke:var(--c-faint);stroke-width:1}
.pbx .wire{fill:none;stroke:var(--c-muted);stroke-width:1.4}
.pbx .wire.dash{stroke-dasharray:5 4}
.pbx .wire.acc{stroke:var(--c-mauve)}
.pbx .head{fill:var(--c-muted)}
.pbx .head.acc{fill:var(--c-mauve)}
.pbx .boundary{stroke:var(--c-border);stroke-width:1;stroke-dasharray:6 5}
.pbx .life{stroke:var(--c-faint);stroke-width:1.2;stroke-dasharray:3 4}
.pbx .dot{fill:var(--c-mauve)}
</style>
<defs><marker id="pbx-hw-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" class="head"/></marker><marker id="pbx-hw-ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" class="head acc"/></marker></defs>
<rect x="20" y="30" width="260" height="260" rx="10" class="region"/>
<text x="34" y="50" class="lbl mono" text-anchor="start">1 · write</text>
<rect x="310" y="30" width="320" height="260" rx="10" class="region"/>
<text x="324" y="50" class="lbl mono" text-anchor="start">2 · build</text>
<rect x="660" y="30" width="280" height="260" rx="10" class="region"/>
<text x="674" y="50" class="lbl mono" text-anchor="start">3 · run</text>
<rect x="40" y="76" width="220" height="64" rx="7" class="box"/>
<text x="150.0" y="104.5" class="t mono" text-anchor="middle">podbox.toml</text>
<text x="150.0" y="121.5" class="s" text-anchor="middle">image · packages · access</text>
<rect x="40" y="200" width="220" height="64" rx="7" class="box opt"/>
<text x="150.0" y="228.5" class="t" text-anchor="middle">Profile</text>
<text x="150.0" y="245.5" class="s mono" text-anchor="middle">extends = &quot;profile:fedora&quot;</text>
<path d="M 150 200 L 150 140" class="wire dash" marker-end="url(#pbx-hw-h)"/>
<text x="158" y="176" class="m" text-anchor="start">extends</text>
<rect x="330" y="76" width="280" height="64" rx="7" class="box acc-mauve"/>
<text x="470.0" y="104.5" class="t mono" text-anchor="middle">podbox build</text>
<text x="470.0" y="121.5" class="s" text-anchor="middle">pure function of the config</text>
<rect x="330" y="200" width="132" height="64" rx="7" class="box"/>
<text x="396.0" y="228.5" class="t" text-anchor="middle">OCI image</text>
<text x="396.0" y="245.5" class="s" text-anchor="middle">packages baked in</text>
<rect x="478" y="200" width="132" height="64" rx="7" class="box"/>
<text x="544.0" y="228.5" class="t" text-anchor="middle">Quadlet units</text>
<text x="544.0" y="245.5" class="s mono" text-anchor="middle">.container .socket</text>
<path d="M 470 140 L 470 170 L 396 170 L 396 200" class="wire" marker-end="url(#pbx-hw-h)"/>
<path d="M 470 140 L 470 170 L 544 170 L 544 200" class="wire" marker-end="url(#pbx-hw-h)"/>
<rect x="680" y="76" width="240" height="64" rx="7" class="box"/>
<text x="800.0" y="104.5" class="t mono" text-anchor="middle">systemd --user</text>
<text x="800.0" y="121.5" class="s" text-anchor="middle">starts, restarts, keeps logs</text>
<rect x="680" y="200" width="112" height="64" rx="7" class="box"/>
<text x="736.0" y="228.5" class="t" text-anchor="middle">Container</text>
<text x="736.0" y="245.5" class="s" text-anchor="middle">your shell</text>
<rect x="808" y="200" width="112" height="64" rx="7" class="box"/>
<text x="864.0" y="228.5" class="t" text-anchor="middle">Host side</text>
<text x="864.0" y="245.5" class="s" text-anchor="middle">socket, filters</text>
<path d="M 800 140 L 800 170 L 736 170 L 736 200" class="wire" marker-end="url(#pbx-hw-h)"/>
<path d="M 800 140 L 800 170 L 864 170 L 864 200" class="wire" marker-end="url(#pbx-hw-h)"/>
<path d="M 792 232 L 808 232" class="wire" marker-end="url(#pbx-hw-h)" marker-start="url(#pbx-hw-h)"/>
<path d="M 260 108 L 330 108" class="wire" marker-end="url(#pbx-hw-h)"/>
<path d="M 610 108 L 680 108" class="wire" marker-end="url(#pbx-hw-h)"/>
<text x="645" y="100" class="m" text-anchor="middle">install</text>
<text x="20" y="314" class="m" text-anchor="start">No podbox process stays running: after the build, it is ordinary systemd units and Podman.</text>
</svg>
