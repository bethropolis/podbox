site_name: podbox
site_url: https://bethropolis.github.io/podbox/
site_description: podbox is a declarative, Podman-native container environment manager for Linux — write one TOML file, get an OCI image plus systemd Quadlet units with Wayland/GPU passthrough. A distrobox alternative with config-as-code and no daemon.
site_author: bethropolis
repo_url: https://github.com/bethropolis/podbox
repo_name: bethropolis/podbox
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: catppuccin-mocha
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: catppuccin-latte
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bethropolis/podbox
      name: GitHub repository

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - Configuration: config.md
  - Baked-in Base Packages: baked-in-packages.md
  - Architecture: architecture.md
  - Desktop Integration: export.md
  - Guest Daemon: guest.md
  - D-Bus Proxy: dbus-proxy.md
  - Quadlet Reference: quadlet.md
  - Protocol: protocol.md
  - Troubleshooting: troubleshooting.md

extra_css:
  - stylesheets/catppuccin.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - social

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

