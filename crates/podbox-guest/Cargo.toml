[package]
name = "podbox-guest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Guest-side daemon and entrypoint for podbox containers: socket protocol, interceptors, and idle shutdown."
documentation = "https://docs.rs/podbox-guest"
keywords = ["container", "podman", "guest", "daemon"]
categories = ["command-line-utilities", "virtualization"]

[lib]
name = "podbox_guest"
path = "src/lib.rs"

[[bin]]
name = "podbox-guest"
path = "src/main.rs"

[dependencies]
serde           = { workspace = true }
serde_json      = { workspace = true }
anyhow          = { workspace = true }
nix             = { workspace = true }
rustix          = { workspace = true }
signal-hook     = { workspace = true }
thiserror       = { workspace = true }
fd-lock         = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald   = { workspace = true }
podbox-protocol   = { workspace = true }

[lints.rust]
# The guest tree contains no unsafe code at all.
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"
