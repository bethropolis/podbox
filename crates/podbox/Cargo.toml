[package]
name = "podbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Declarative Podman-native container environment manager. Define an environment as a TOML file and let systemd own its lifecycle."
documentation = "https://docs.rs/podbox-cli"
keywords = ["container", "podman", "systemd", "quadlet", "devcontainer"]
categories = ["command-line-utilities", "virtualization"]

[lib]
name = "podbox"
path = "src/lib.rs"

[[bin]]
name = "podbox"
path = "src/main.rs"

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:dialoguer",
    "dep:hex",
    "dep:indexmap",
    "dep:nix",
    "dep:notify-rust",
    "dep:owo-colors",
    "dep:rustix",
    "dep:sha2",
    "dep:shell-words",
    "dep:signal-hook",
    "dep:toml_edit",
    "dep:tracing-journald",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:which",
]

[dependencies]
serde           = { workspace = true }
serde_json      = { workspace = true }
toml            = { workspace = true }
anyhow          = { workspace = true }
thiserror       = { workspace = true }
dirs            = { workspace = true }
tracing         = { workspace = true }
podbox-protocol = { workspace = true }
clap            = { workspace = true, optional = true }
clap_complete   = { workspace = true, optional = true }
which           = { workspace = true, optional = true }
indexmap        = { workspace = true, optional = true }
notify-rust     = { workspace = true, optional = true }
nix             = { workspace = true, optional = true }
rustix          = { workspace = true, optional = true }
signal-hook     = { workspace = true, optional = true }
dialoguer       = { workspace = true, optional = true }
sha2            = { workspace = true, optional = true }
hex             = { workspace = true, optional = true }
url             = { workspace = true, optional = true }
toml_edit       = { workspace = true, optional = true }
shell-words     = { workspace = true, optional = true }
owo-colors      = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-journald   = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta      = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }

[lints]
workspace = true
