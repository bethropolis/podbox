name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/install-online.sh'
      - '.github/workflows/docs.yml'
      # The site renders the workspace version, so a release bump must
      # redeploy it or the published version badge goes stale.
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: website

      - run: bun run build
        working-directory: website
        env:
          # Lets the build-time CI status fetch use the 5000/hr
          # authenticated limit instead of the 60/hr anonymous one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Smoke-test the installer URL the README and guides link to.
      - run: bash -n dist/install.sh && test -s dist/install.sh
        working-directory: website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
