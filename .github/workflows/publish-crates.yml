name: Publish crates

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.6.7)"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # For release: skip prereleases. For workflow_run: only after successful Release.
    if: >-
      ${{
        (github.event_name == 'release' && github.event.release.prerelease == false) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Skip prereleases (workflow_run / dispatch)
        if: contains(steps.tag.outputs.tag, '-')
        run: echo "Prerelease tag ${{ steps.tag.outputs.tag }} — skipping" && exit 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches workspace version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER=$(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.name=="podbox-cli") | .version')
          if [ "${TAG#v}" != "$VER" ]; then
            echo "tag $TAG != workspace version $VER" >&2
            exit 1
          fi

      - name: Dry-run podbox-protocol
        run: cargo publish -p podbox-protocol --dry-run

      - name: Publish podbox-protocol (skip if already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="podbox-protocol") | .version')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "podbox-ci" "https://crates.io/api/v1/crates/podbox-protocol/$VER")
          if [ "$CODE" = "200" ]; then
            echo "podbox-protocol $VER already on crates.io — skipping"
            exit 0
          fi
          cargo publish -p podbox-protocol
          echo "Waiting for crates.io index to update..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "podbox-ci" "https://crates.io/api/v1/crates/podbox-protocol/$VER")
            if [ "$CODE" = "200" ]; then
              echo "podbox-protocol $VER now on crates.io"
              break
            fi
            echo "  not yet ($CODE), retry $i/30..."
            sleep 10
          done

      - name: Dry-run podbox-cli
        run: cargo publish -p podbox-cli --dry-run

      - name: Publish podbox-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p podbox-cli

      - name: Dry-run podbox-guest
        run: cargo publish -p podbox-guest --dry-run

      - name: Publish podbox-guest
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p podbox-guest
