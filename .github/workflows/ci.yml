name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup target add x86_64-unknown-linux-musl
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The Studio shares the pure core via wasm: the cli-gated modules must
      # stay out of the no-default build on wasm32-unknown-unknown.
      - run: cargo check -p podbox-cli --lib --no-default-features --target wasm32-unknown-unknown

  website:
    runs-on: ubuntu-latest
    defaults:
      # The package.json and bun.lock live in website/, not the repo root.
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Generates .astro/types.d.ts (gitignored) so astro:content and
      # import.meta.env resolve during typecheck on fresh checkouts.
      - run: bun run astro sync
      # Nothing typechecked the Studio before, so type errors accumulated
      # unnoticed; `check:studio` alone only exercises the schema layer.
      - run: bun run typecheck
      - run: bun run check:studio

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: podbox-${{ github.ref_name }}
          path: target/release/podbox
