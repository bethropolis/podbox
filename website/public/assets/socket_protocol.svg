<svg xmlns="http://www.w3.org/2000/svg" class="pbx" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="pbx-sp-title pbx-sp-desc">
<title id="pbx-sp-title">Host-guest socket protocol</title>
<desc id="pbx-sp-desc">The guest daemon and every interceptor open a connection to the host socket, send hello with the capabilities they want, receive hello_ack, then send requests such as notify, which podbox serve passes to the desktop.</desc>
<style>
.pbx{--k-surface:#e6e9ef;--k-base:#eff1f5;--k-border:#acb0be;--k-faint:#ccd0da;--k-text:#4c4f69;--k-sub:#5c5f77;--k-muted:#8c8fa1;--k-mauve:#8839ef;--k-blue:#1e66f5;--k-green:#40a02b;--k-peach:#fe640b}
@media (prefers-color-scheme:dark){.pbx{--k-surface:#181825;--k-base:#1e1e2e;--k-border:#585b70;--k-faint:#313244;--k-text:#cdd6f4;--k-sub:#a6adc8;--k-muted:#7f849c;--k-mauve:#cba6f7;--k-blue:#89b4fa;--k-green:#a6e3a1;--k-peach:#fab387}}
.pbx{--c-surface:var(--bg-mantle,var(--k-surface));--c-base:var(--bg-base,var(--k-base));--c-border:var(--border-focus,var(--k-border));--c-faint:var(--border,var(--k-faint));--c-text:var(--text-primary,var(--k-text));--c-sub:var(--text-subtext,var(--k-sub));--c-muted:var(--text-muted,var(--k-muted));--c-mauve:var(--accent-mauve,var(--k-mauve));--c-blue:var(--accent-blue,var(--k-blue));--c-green:var(--accent-green,var(--k-green));--c-peach:var(--accent-peach,var(--k-peach))}
.pbx text{font-family:Geist,Inter,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;fill:var(--c-text)}
.pbx .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
.pbx .t{font-size:13px;font-weight:600}
.pbx .s{font-size:10.5px;fill:var(--c-sub)}
.pbx .m{font-size:10.5px;fill:var(--c-muted)}
.pbx .lbl{font-size:11px;fill:var(--c-muted);letter-spacing:.02em}
.pbx .num{font-size:11px;font-weight:600;fill:var(--c-base)}
.pbx .box{fill:var(--c-surface);stroke:var(--c-border);stroke-width:1}
.pbx .opt{stroke-dasharray:4 3}
.pbx .acc-mauve{fill:color-mix(in srgb,var(--c-mauve) 13%,var(--c-surface));stroke:var(--c-mauve)}
.pbx .acc-blue{fill:color-mix(in srgb,var(--c-blue) 13%,var(--c-surface));stroke:var(--c-blue)}
.pbx .acc-peach{fill:color-mix(in srgb,var(--c-peach) 13%,var(--c-surface));stroke:var(--c-peach)}
.pbx .acc-green{fill:color-mix(in srgb,var(--c-green) 13%,var(--c-surface));stroke:var(--c-green)}
.pbx .region{fill:color-mix(in srgb,var(--c-faint) 22%,transparent);stroke:var(--c-faint);stroke-width:1}
.pbx .wire{fill:none;stroke:var(--c-muted);stroke-width:1.4}
.pbx .wire.dash{stroke-dasharray:5 4}
.pbx .wire.acc{stroke:var(--c-mauve)}
.pbx .head{fill:var(--c-muted)}
.pbx .head.acc{fill:var(--c-mauve)}
.pbx .boundary{stroke:var(--c-border);stroke-width:1;stroke-dasharray:6 5}
.pbx .life{stroke:var(--c-faint);stroke-width:1.2;stroke-dasharray:3 4}
.pbx .dot{fill:var(--c-mauve)}
</style>
<defs><marker id="pbx-sp-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" class="head"/></marker><marker id="pbx-sp-ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" class="head acc"/></marker></defs>
<rect x="35" y="24" width="190" height="56" rx="7" class="box"/>
<text x="130.0" y="48.5" class="t mono" text-anchor="middle">notify-send</text>
<text x="130.0" y="65.5" class="s" text-anchor="middle">interceptor</text>
<line x1="130" y1="80" x2="130" y2="440" class="life"/>
<rect x="265" y="24" width="190" height="56" rx="7" class="box"/>
<text x="360.0" y="48.5" class="t mono" text-anchor="middle">podbox-guest</text>
<text x="360.0" y="65.5" class="s" text-anchor="middle">daemon</text>
<line x1="360" y1="80" x2="360" y2="440" class="life"/>
<rect x="515" y="24" width="190" height="56" rx="7" class="box acc-mauve"/>
<text x="610.0" y="48.5" class="t mono" text-anchor="middle">podbox serve</text>
<text x="610.0" y="65.5" class="s" text-anchor="middle">host socket</text>
<line x1="610" y1="80" x2="610" y2="440" class="life"/>
<rect x="755" y="24" width="190" height="56" rx="7" class="box"/>
<text x="850.0" y="48.5" class="t" text-anchor="middle">Your desktop</text>
<text x="850.0" y="65.5" class="s" text-anchor="middle">notifications</text>
<line x1="850" y1="80" x2="850" y2="440" class="life"/>
<line x1="490" y1="90" x2="490" y2="440" class="boundary"/>
<text x="482" y="104" class="lbl mono" text-anchor="end">container</text>
<text x="498" y="104" class="lbl mono" text-anchor="start">host</text>
<path d="M 360 140 L 610 140" class="wire acc" marker-end="url(#pbx-sp-ha)"/>
<text x="374" y="132" class="s mono" text-anchor="start">hello</text>
<text x="374" y="156" class="m" text-anchor="start">capabilities it wants</text>
<path d="M 610 196 L 360 196" class="wire dash" marker-end="url(#pbx-sp-h)"/>
<text x="596" y="188" class="s mono" text-anchor="end">hello_ack</text>
<text x="596" y="212" class="m" text-anchor="end">accepted · rejected</text>
<rect x="268" y="226" width="184" height="30" rx="6" class="box"/>
<text x="360" y="245" class="s" text-anchor="middle">installs interceptors</text>
<path d="M 130 296 L 610 296" class="wire acc" marker-end="url(#pbx-sp-ha)"/>
<text x="144" y="288" class="s mono" text-anchor="start">hello</text>
<path d="M 610 336 L 130 336" class="wire dash" marker-end="url(#pbx-sp-h)"/>
<text x="596" y="328" class="s mono" text-anchor="end">hello_ack</text>
<path d="M 130 384 L 610 384" class="wire acc" marker-end="url(#pbx-sp-ha)"/>
<text x="144" y="376" class="s mono" text-anchor="start">notify</text>
<text x="144" y="400" class="m" text-anchor="start">summary, body, actions</text>
<path d="M 610 384 L 850 384" class="wire" marker-end="url(#pbx-sp-h)"/>
<text x="624" y="376" class="s mono" text-anchor="start">show</text>
<text x="20" y="462" class="m" text-anchor="start">Every frame: 4-byte big-endian length, then that many bytes of JSON. See protocol.md.</text>
</svg>
